name: procurement-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-procurement_test}
      MYSQL_USER: ${MYSQL_USER:-procurement_test}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - test_mysql_data:/var/lib/mysql
      - type: bind
        source: ${TEST_DB_BASELINE_FILE:-./db/test-init/runtime/001_baseline.sql}
        target: /docker-entrypoint-initdb.d/001_baseline.sql
        read_only: true
      - type: bind
        source: ./db/test-init/010_seed_test.sql
        target: /docker-entrypoint-initdb.d/010_seed_test.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} "$${MYSQL_DATABASE}"
          -Nse "SELECT 1 FROM sys_user WHERE username = 'test-admin' AND is_deleted = 0 LIMIT 1"
          2>/dev/null | grep -q '^1$$'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - data_internal
    mem_limit: ${TEST_MYSQL_MEMORY:-2g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data_internal
    mem_limit: ${TEST_REDIS_MEMORY:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    logging: *default-logging

  db-configure:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-procurement_test}
      TEST_ADMIN_PASSWORD_HASH: ${TEST_ADMIN_PASSWORD_HASH:?TEST_ADMIN_PASSWORD_HASH is required}
      TEST_FEISHU_TEST_CARD_ENABLED: ${TEST_FEISHU_TEST_CARD_ENABLED:-false}
      TEST_FEISHU_RECIPIENT_EMAIL: ${TEST_FEISHU_RECIPIENT_EMAIL:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        hash="$${TEST_ADMIN_PASSWORD_HASH}"
        if [ "$${#hash}" -ne 60 ] || ! printf '%s\n' "$${hash}" | grep -Eq '^\$$2[aby]\$$[0-9]{2}\$$[./A-Za-z0-9]{53}$$'; then
          echo "TEST_ADMIN_PASSWORD_HASH must be a valid 60-character BCrypt hash" >&2
          exit 1
        fi

        marker_count="$$(mysql -h mysql -uroot "$${MYSQL_DATABASE}" -Nse "SELECT COUNT(*) FROM procurement_setting WHERE setting_key = 'test_environment_marker' AND setting_value = 'procurement-test' AND is_deleted = 0")"
        if [ "$${marker_count}" != "1" ]; then
          echo "Refusing to configure a database without the procurement-test safety marker" >&2
          exit 1
        fi

        mysql -h mysql -uroot "$${MYSQL_DATABASE}" < /test-init/999_safety.sql

        test_card_enabled="$${TEST_FEISHU_TEST_CARD_ENABLED:-false}"
        case "$${test_card_enabled}" in
          true|false) ;;
          *)
            echo "TEST_FEISHU_TEST_CARD_ENABLED must be true or false" >&2
            exit 1
            ;;
        esac

        recipient_email="$${TEST_FEISHU_RECIPIENT_EMAIL:-}"
        if [ "$${test_card_enabled}" = "true" ]; then
          if ! printf '%s' "$${recipient_email}" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$$'; then
            echo "TEST_FEISHU_RECIPIENT_EMAIL must be a valid test recipient when the test card is enabled" >&2
            exit 1
          fi
          mysql -h mysql -uroot "$${MYSQL_DATABASE}" --execute="
            UPDATE procurement_setting
            SET setting_value = 'email', updated_by = 0, is_deleted = 0
            WHERE setting_key = 'feishu_approval_card_receive_id_type';
          "
        fi

        mysql -h mysql -uroot "$${MYSQL_DATABASE}" --execute="
          UPDATE sys_user
          SET password_hash = '$${hash}',
              must_change_password = 1,
              password_changed_at = NOW(),
              session_secret = NULL
          WHERE username = 'test-admin'
            AND password_hash LIKE 'DISABLED-%'
            AND is_deleted = 0;
        "

        configured_users="$$(mysql -h mysql -uroot "$${MYSQL_DATABASE}" -Nse "SELECT COUNT(*) FROM sys_user WHERE username = 'test-admin' AND CHAR_LENGTH(password_hash) = 60 AND LEFT(password_hash, 2) = CONCAT(CHAR(36), '2') AND is_deleted = 0")"
        test "$${configured_users}" = "1"
        echo "Test database safety configuration applied"
    volumes:
      - type: bind
        source: ./db/test-init/999_safety.sql
        target: /test-init/999_safety.sql
        read_only: true
    networks:
      - data_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    logging: *default-logging

  backend:
    image: ${TEST_BACKEND_IMAGE:-procurement-backend:test-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: test
      APP_SCHEDULING_ENABLED: "false"
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-procurement_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-procurement_test}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: enterprise-procurement-platform-test
      JWT_EXPIRE_SECONDS: 7200
      OPENAPI_ENABLED: "true"
      FEISHU_AUTH_ENABLED: "false"
      FEISHU_APP_ID: ${TEST_FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${TEST_FEISHU_APP_SECRET:-}
      FEISHU_APP_ACCESS_TOKEN_URL: http://feishu-egress:8080/open-apis/auth/v3/app_access_token/internal
      FEISHU_TENANT_ACCESS_TOKEN_URL: http://feishu-egress:8080/open-apis/auth/v3/tenant_access_token/internal
      FEISHU_ACCESS_TOKEN_URL: http://feishu-egress:8080/open-apis/authen/v1/access_token
      FEISHU_USER_INFO_URL: http://feishu-egress:8080/open-apis/authen/v1/user_info
      FEISHU_USER_DETAIL_URL: http://feishu-egress:8080/open-apis/contact/v3/users/%s
      FEISHU_USER_BATCH_GET_ID_URL: http://feishu-egress:8080/open-apis/contact/v3/users/batch_get_id
      FEISHU_DEPARTMENT_CHILDREN_URL: http://feishu-egress:8080/open-apis/contact/v3/departments/%s/children
      FEISHU_DEPARTMENT_SEARCH_URL: http://feishu-egress:8080/open-apis/contact/v3/departments/search
      FEISHU_DEPARTMENT_USERS_URL: http://feishu-egress:8080/open-apis/contact/v3/users/find_by_department
      FEISHU_BOT_ENABLED: "false"
      FEISHU_BOT_VERIFICATION_TOKEN: ""
      FEISHU_BOT_MESSAGE_SEND_URL: http://feishu-egress:8080/open-apis/im/v1/messages
      FEISHU_APPROVAL_CARD_ENABLED: "false"
      FEISHU_APPROVAL_CARD_HEARTBEAT_ENABLED: "false"
      FEISHU_APPROVAL_CARD_LONG_CONNECTION_ENABLED: "false"
      FEISHU_APPROVAL_CARD_TEST_RECIPIENT_EMAIL: ${TEST_FEISHU_RECIPIENT_EMAIL:-}
      FEISHU_APPROVAL_CARD_VERIFICATION_TOKEN: ""
      FEISHU_APPROVAL_CARD_ENCRYPT_KEY: ""
      FEISHU_APPROVAL_CARD_MESSAGE_SEND_URL: http://feishu-egress:8080/open-apis/im/v1/messages
      FEISHU_APPROVAL_CARD_MESSAGE_PATCH_URL: http://feishu-egress:8080/open-apis/im/v1/messages/%s
      DIFY_PROCUREMENT_ENABLED: "false"
      DIFY_PROCUREMENT_API_KEY: ""
      M3_VISION_ENABLED: "false"
      M3_API_KEY: ""
      QDRANT_ENABLED: "false"
      SHOPPING_TOOL_TOKEN: ""
      VERSION_UPGRADE_GITHUB_TOKEN: ""
      DEPLOY_GITHUB_TOKEN: ""
      GITHUB_TOKEN: ""
      PLATFORM_FEEDBACK_STORAGE_DIR: /app/data/feedback
      ORDER_INVOICE_STORAGE_DIR: /app/data/order-invoices
    volumes:
      - test_feedback_data:/app/data/feedback
      - test_order_invoice_data:/app/data/order-invoices
    depends_on:
      db-configure:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_internal
      - data_internal
    mem_limit: ${TEST_BACKEND_MEMORY:-2g}
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  feishu-egress:
    image: ${TEST_FRONTEND_IMAGE:-procurement-frontend:test-local}
    restart: unless-stopped
    user: "101:101"
    volumes:
      - type: bind
        source: ../frontend-vue/deploy/nginx/test-feishu-egress.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      app_internal:
        gw_priority: 0
      feishu_egress:
        gw_priority: 1
    mem_limit: ${TEST_FEISHU_EGRESS_MEMORY:-128m}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: ${TEST_FRONTEND_IMAGE:-procurement-frontend:test-local}
    restart: unless-stopped
    ports:
      - ${TEST_BIND_ADDRESS:-127.0.0.1}:${TEST_HTTP_PORT:-18080}:80
    volumes:
      - type: bind
        source: ../frontend-vue/deploy/nginx/test.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_internal
      - test_ingress
    mem_limit: ${TEST_FRONTEND_MEMORY:-256m}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=0755
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  app_internal:
    internal: true
  data_internal:
    internal: true
  test_ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  feishu_egress:
    driver: bridge

volumes:
  test_mysql_data:
  test_redis_data:
  test_feedback_data:
  test_order_invoice_data:
